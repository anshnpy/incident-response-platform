name: Deploy Incident Response Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare types
        run: npx wrangler types --env-interface CloudflareEnv cloudflare-env.d.ts

      - name: Lint
        run: npm run lint

      - name: Build OpenNext for Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Upload Cloudflare Worker version
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload 2>&1 | tee wrangler-upload.log
          VERSION_ID=$(grep -oE 'Worker Version ID: [0-9a-f-]+' wrangler-upload.log | tail -1 | sed 's/.*: //')
          if [ -z "$VERSION_ID" ]; then
            echo "Failed to extract Worker Version ID" >&2
            exit 1
          fi
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "Uploaded version: $VERSION_ID"

      - name: Deploy Cloudflare Worker version
        run: npx wrangler versions deploy "${{ steps.upload.outputs.version_id }}@100%" -y
